server:
  port: ${MINDMARK_SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-request: true
      force-response: true

spring:
  application:
    name: mindmark-server
  datasource:
    url: jdbc:postgresql://${MINDMARK_DB_HOST:localhost}:${MINDMARK_DB_PORT:5432}/${MINDMARK_DB_NAME:mindmark}
    username: ${MINDMARK_DB_USERNAME:postgres}
    password: ${MINDMARK_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MindMarkHikariPool
      maximum-pool-size: ${MINDMARK_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${MINDMARK_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${MINDMARK_DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${MINDMARK_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${MINDMARK_DB_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: ${MINDMARK_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${MINDMARK_REDIS_HOST:localhost}
      port: ${MINDMARK_REDIS_PORT:6379}
      password: ${MINDMARK_REDIS_PASSWORD:}
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: ${MINDMARK_ACTUATOR_EXPOSED_ENDPOINTS:health}
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: ${MINDMARK_LOG_SQL:warn}
    org.hibernate.orm.jdbc.bind: ${MINDMARK_LOG_SQL_BIND:warn}
    org.springframework.web: ${MINDMARK_LOG_WEB:info}
    com.mindmark.server: ${MINDMARK_LOG_APP:info}

springdoc:
  api-docs:
    enabled: ${MINDMARK_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${MINDMARK_OPENAPI_ENABLED:false}
    path: /swagger-ui.html

mindmark:
  security:
    # Keep false for local development. Production should set this to true
    # and inject non-default secrets through the environment.
    strict-secrets: ${MINDMARK_SECURITY_STRICT_SECRETS:false}
    # Only these reverse-proxy CIDRs may provide X-Forwarded-For. Leave empty
    # when the service is exposed directly or through a local development proxy.
    trusted-proxy-cidrs: ${MINDMARK_SECURITY_TRUSTED_PROXY_CIDRS:}
    login-rate-limit:
      window-seconds: ${MINDMARK_LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
      account-max-attempts: ${MINDMARK_LOGIN_RATE_LIMIT_ACCOUNT_MAX_ATTEMPTS:10}
      ip-max-attempts: ${MINDMARK_LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS:50}
  storage:
    minio:
      endpoint: ${MINDMARK_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINDMARK_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINDMARK_MINIO_SECRET_KEY:minioadmin123}
      bucket: ${MINDMARK_MINIO_BUCKET:mindmark-artifacts}
  ai:
    key-secret: ${MINDMARK_AI_KEY_SECRET:mindmark-local-ai-key-secret}
    question:
      default-provider: ${MINDMARK_AI_QUESTION_PROVIDER:OPENAI}
      timeout-ms: ${MINDMARK_AI_QUESTION_TIMEOUT_MS:90000}
      max-tokens: ${MINDMARK_AI_QUESTION_MAX_TOKENS:2200}
    grading:
      provider-enabled: ${MINDMARK_AI_GRADING_PROVIDER_ENABLED:true}
      async-enabled: ${MINDMARK_AI_GRADING_ASYNC_ENABLED:true}
      timeout-ms: ${MINDMARK_AI_GRADING_TIMEOUT_MS:25000}
      max-tokens: ${MINDMARK_AI_GRADING_MAX_TOKENS:1000}
      job-timeout-ms: ${MINDMARK_AI_GRADING_JOB_TIMEOUT_MS:300000}
      recover-initial-delay-ms: ${MINDMARK_AI_GRADING_RECOVER_INITIAL_DELAY_MS:60000}
      recover-fixed-delay-ms: ${MINDMARK_AI_GRADING_RECOVER_FIXED_DELAY_MS:120000}
    provider:
      max-attempts: ${MINDMARK_AI_PROVIDER_MAX_ATTEMPTS:3}
      retry-backoff-ms: ${MINDMARK_AI_PROVIDER_RETRY_BACKOFF_MS:1500}
      max-concurrency: ${MINDMARK_AI_PROVIDER_MAX_CONCURRENCY:1}
      # Custom provider endpoints are allowed to target private networks only
      # when explicitly enabled for a trusted local/internal deployment.
      allow-private-base-url: ${MINDMARK_AI_ALLOW_PRIVATE_BASE_URL:false}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
      model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-latest}
      api-key: ${ANTHROPIC_API_KEY:}
    # Legacy lecture-draft provider retained for backward compatibility.
    kimi:
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
      api-key: ${KIMI_API_KEY:}
      model: ${KIMI_MODEL:kimi-k2.6}
      max-tokens: ${KIMI_MAX_TOKENS:1800}
      timeout-ms: ${KIMI_TIMEOUT_MS:20000}
sa-token:
  # Iteration 16: production-grade session auth; frontend keeps standard Authorization: Bearer <token> header.
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${MINDMARK_AUTH_TIMEOUT_SECONDS:86400}
  active-timeout: ${MINDMARK_AUTH_ACTIVE_TIMEOUT_SECONDS:-1}
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-read-body: false
  is-log: ${MINDMARK_AUTH_LOG_ENABLED:false}
  is-print: false
