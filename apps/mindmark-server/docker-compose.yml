services:
  minio:
    image: minio/minio:latest
    container_name: mindmark-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: bind
        source: D:/minio
        target: /data
    networks:
      - mindmark-backend

  postgres:
    image: postgres:16-alpine
    container_name: mindmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindmark}
      POSTGRES_USER: ${POSTGRES_USER:-mindmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmark_dev_password}
    ports:
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mindmark-backend

  redis:
    image: redis:7-alpine
    container_name: mindmark-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD:
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mindmark-backend

volumes:
  postgres-data:
  redis-data:

networks:
  mindmark-backend:
    driver: bridge
