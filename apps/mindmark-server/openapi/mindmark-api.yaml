        - { name: examId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewArtifactRequest' }
      responses:
        '200':
          description: Exported artifact metadata and download URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewArtifactResponse' }
  /api/v1/review-artifacts/{artifactId}/download:
    get:
      tags: [Review]
      summary: Get presigned download URL for a review artifact
      parameters:
        - { name: artifactId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Artifact metadata with a short-lived download URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewArtifactResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sa-Token opaque UUID
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string }
    PaperId:
      name: paperId
      in: path
      required: true
      schema: { type: string }
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: string }
    AnswerSheetId:
      name: answerSheetId
      in: path
      required: true
      schema: { type: string }
    GradingTaskId:
      name: gradingTaskId
      in: path
      required: true
      schema: { type: string }
  schemas:
    ApiResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: string, example: '0' }
        message: { type: string, example: Success }
        data: { nullable: true }
        traceId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    TeacherDashboardMetric:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
        hint: { type: string }
    TeacherDashboardTask:
      type: object
      properties:
        name: { type: string }
        meta: { type: string }
        status: { type: string }
        tone: { type: string, enum: [default, info, processing, success, warning, danger] }
        to: { type: string }
    TeacherDashboard:
      type: object
      properties:
        metrics:
          type: array
          items: { $ref: '#/components/schemas/TeacherDashboardMetric' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TeacherDashboardTask' }
    TeacherDashboardResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TeacherDashboard' }
    AdminUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        username: { type: string }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, TEACHER, TA, STUDENT] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        mustChangePassword: { type: boolean }
        failedLoginCount: { type: integer }
        lockedUntil: { type: string, format: date-time, nullable: true }
        accountSource: { type: string }
        studentId: { type: string, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminUserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AdminUser' }
    AdminUserPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResponse'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/AdminUser' }
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
    UpdateUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string, enum: [ADMIN, TEACHER, TA, STUDENT] }
    ClassAssignment:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        classId: { type: string }
        assignmentRole: { type: string, enum: [OWNER, ASSISTANT] }
        createdAt: { type: string, format: date-time }
    ClassAssignmentRequest:
      type: object
      required: [classId, assignmentRole]
      properties:
        classId: { type: string }
        assignmentRole: { type: string, enum: [OWNER, ASSISTANT] }
    ClassAssignmentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ClassAssignment' }
    ClassAssignmentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ClassAssignment' }
    AuthAuditLog:
      type: object
      properties:
        id: { type: string }
        actorId: { type: string }
        action: { type: string }
        targetUserId: { type: string, nullable: true }
        result: { type: string }
        detail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AuthAuditLogPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResponse'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/AuthAuditLog' }
    BooleanResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { type: boolean }
    LoginRequest:
      type: object
      properties:
        userId: { type: string, nullable: true, example: u-teacher-001 }
        username: { type: string, nullable: true, example: teacher@mindmark.local }
        password: { type: string, nullable: true, example: dev-password }
    LoginData:
      type: object
      required: [token, user, mustChangePassword]
      properties:
        token: { type: string, example: 2f5e8d5d-7d3b-4f18-b1c8-85d8d6a3f111 }
        user: { $ref: '#/components/schemas/CurrentUser' }
        mustChangePassword: { type: boolean, example: false }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/LoginData' }
    LogoutData:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/LogoutData' }
    CurrentUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        username: { type: string }
        mustChangePassword: { type: boolean }
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, TEACHER, TA, STUDENT]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        studentId: { type: string, nullable: true }
    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CurrentUser' }
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, description: Must differ from old password and contain both letters and digits. }
    ChangePasswordData:
      type: object
      required: [success, mustChangePassword]
      properties:
        success: { type: boolean }
        mustChangePassword: { type: boolean }
    ChangePasswordResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChangePasswordData' }
    AcademicStatus:
      type: string
      enum: [ACTIVE, DISABLED, ARCHIVED]
    CourseRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AcademicStatus' }
    Course:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AcademicStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CourseResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Course' }
    CourseListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Course' }
    TeachingClassRequest:
      type: object
      required: [code, name]
      properties:
        courseId: { type: string }
        code: { type: string }
        name: { type: string }
        grade: { type: string, nullable: true }
        major: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AcademicStatus' }
    TeachingClass:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        courseName: { type: string }
        code: { type: string }
        name: { type: string }
        grade: { type: string, nullable: true }
        major: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AcademicStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TeachingClassResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TeachingClass' }
    TeachingClassListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TeachingClass' }
    StudentImportRow:
      type: object
      required: [studentNo, name]
      properties:
        studentNo: { type: string, example: '202601345678' }
        name: { type: string, example: 瀵姳绗?}
        email: { type: string, nullable: true }
        className: { type: string, nullable: true }
        grade: { type: string, nullable: true }
        major: { type: string, nullable: true }
    StudentRosterImportRequest:
      type: object
      required: [students]
      properties:
        classId: { type: string, nullable: true, description: Ignored when classId is supplied by path. }
        className: { type: string, nullable: true, description: Kept for backward compatibility; server uses trusted teaching_class.name. }
        students:
          type: array
          items: { $ref: '#/components/schemas/StudentImportRow' }
    RosterImportError:
