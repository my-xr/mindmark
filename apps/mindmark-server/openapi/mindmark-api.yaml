                $ref: '#/components/schemas/ReviewReportPageResponse'
  /api/v1/review-reports/{examId}/lecture-draft/regenerate:
    post:
      tags: [Review]
      summary: Regenerate AI lecture draft
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Updated review report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewReportResponse'
  /api/v1/review-reports/{examId}/lecture-draft/approve:
    post:
      tags: [Review]
      summary: Approve AI lecture draft
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Updated review report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewReportResponse'
  /api/v1/exams/reviews:
    get:
      tags: [Review]
      summary: List exam review reports available to current teacher scope with database pagination
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Review report page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamReviewReportPageResponse' }
  /api/v1/exams/{examId}/review:
    get:
      tags: [Review]
      summary: Get real exam review analysis with AI lecture draft
      parameters:
        - { name: examId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Review report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamReviewReportResponse' }
  /api/v1/exams/{examId}/lecture-draft/regenerate:
    post:
      tags: [Review]
      summary: Regenerate AI lecture draft from latest review analysis
      parameters:
        - { name: examId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: AI lecture draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiLectureDraftResponse' }
  /api/v1/exams/{examId}/lecture-draft/approve:
    post:
      tags: [Review]
