openapi: 3.0.3
info:
  title: MindMark API
  version: v1
  description: MindMark backend API contract for the exam closed loop. Round 1 contracts converge courses, teaching classes and class-scoped permissions.
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Admin
  - name: Academic
  - name: Dashboard
  - name: Question
  - name: Paper
  - name: Exam
  - name: Answer
  - name: Grading
  - name: Score
  - name: Review
  - name: AI
paths:
  /api/v1/system/health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/teacher/dashboard:
    get:
      tags: [Dashboard]
      summary: Get teacher first-screen dashboard aggregate
      description: Returns metrics and top-priority tasks from database-level paged/count queries to avoid front-end fan-out and full-list aggregation.
      responses:
        '200':
          description: Teacher dashboard aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDashboardResponse'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      description: Validates account password, creates a Sa-Token server-side session, and returns an opaque bearer token plus mustChangePassword flag.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login token and current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      description: Invalidates the current Sa-Token session for the bearer token.
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      description: Reads the Sa-Token bearer token from Authorization header and returns current user context. Development header fallback is removed.

      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
  /api/v1/classes:
    get:
      tags: [Academic]
      summary: List classes visible to current user
      description: ADMIN can see all active classes; TEACHER/TA see assigned classes; STUDENT sees own active class.
      responses:
        '200':
          description: Visible teaching classes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingClassListResponse'
  /api/v1/courses:
    get:
      tags: [Academic]
      summary: List courses visible to current user
      description: ADMIN sees all active courses; TEACHER/TA/STUDENT see courses attached to visible classes.
      responses:
        '200':
          description: Visible courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
  /api/v1/admin/courses:
    get:
      tags: [Admin, Academic]
      summary: List courses for administration
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
    post:
      tags: [Admin, Academic]
      summary: Create course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '200':
          description: Created course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
  /api/v1/admin/courses/{courseId}:
    patch:
      tags: [Admin, Academic]
      summary: Update course
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '200':
          description: Updated course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
  /api/v1/admin/classes:
    get:
      tags: [Admin, Academic]
      summary: List teaching classes for administration
      responses:
        '200':
          description: Teaching classes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingClassListResponse'
    post:
      tags: [Admin, Academic]
      summary: Create teaching class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingClassRequest'
      responses:
        '200':
          description: Created teaching class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingClassResponse'
  /api/v1/admin/classes/{classId}:
    patch:
      tags: [Admin, Academic]
      summary: Update teaching class
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingClassRequest'
      responses:
        '200':
          description: Updated teaching class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingClassResponse'
  /api/v1/student-roster-template:
    get:
      tags: [Auth]
      summary: Download student roster CSV template
      responses:
        '200':
          description: CSV template
          content:
            text/csv:
              schema:
                type: string
                format: binary
  /api/v1/classes/{classId}/students/import:
    post:
      tags: [Auth]
      summary: Import students and create accounts
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRosterImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImportResponse'
  /api/v1/roster-import-tasks/{taskId}:
    get:
      tags: [Auth]
      summary: Get roster import task result
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Import task result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterImportResponse'
  /api/v1/classes/{classId}/students:
    get:
      tags: [Auth]
      summary: List imported students in class
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PageSizeParam' }
      responses:
        '200':
          description: Student accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAccountListResponse'
  /api/v1/students/{studentId}/reset-password:
    post:
      tags: [Auth]
      summary: Reset student password to student number last 6 digits
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reset result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users for account governance
      parameters:
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [ADMIN, TEACHER, TA, STUDENT] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, DISABLED] } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PageSizeParam' }
      responses:
        '200':
          description: Paged admin user list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPageResponse' }
  /api/v1/admin/users/{userId}/status:
    patch:
      tags: [Admin]
      summary: Enable or disable user account
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserStatusRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
  /api/v1/admin/users/{userId}/roles:
    put:
      tags: [Admin]
      summary: Replace user roles
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRolesRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
  /api/v1/admin/users/{userId}/unlock:
    post:
      tags: [Admin]
      summary: Clear temporary lock and failed login counter
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Unlocked user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
  /api/v1/admin/users/{userId}/class-assignments:
    get:
      tags: [Admin]
      summary: List teacher/TA class assignments
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: User class assignments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassAssignmentListResponse' }
    post:
      tags: [Admin]
      summary: Create or update teacher/TA class assignment
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassAssignmentRequest' }
      responses:
        '200':
          description: Created or updated assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassAssignmentResponse' }
  /api/v1/admin/users/{userId}/class-assignments/{assignmentId}:
    delete:
      tags: [Admin]
      summary: Delete teacher/TA class assignment
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BooleanResponse' }
  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Query authentication and account governance audit logs
      parameters:
        - { name: actorId, in: query, required: false, schema: { type: string } }
        - { name: targetUserId, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: result, in: query, required: false, schema: { type: string } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PageSizeParam' }
      responses:
        '200':
          description: Paged audit logs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthAuditLogPageResponse' }
  /api/v1/questions:
    get:
      tags: [Question]
      summary: List question bank items
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/QuestionType'
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/Difficulty'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_REVIEW, ACTIVE, DISABLED]
        - name: courseId
          in: query
          schema:
            type: string
        - name: excludePaperId
          in: query
          description: Exclude questions already bound to the specified paper. Used by paper assembly available-question pagination.
          schema:
            type: string
        - name: knowledgePoint
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
            enum: [MANUAL, AI, IMPORT]
      responses:
        '200':
          description: Question page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPageResponse'
    post:
      tags: [Question]
      summary: Create a manual question and persist it to the question bank
      description: Allowed for ADMIN, TEACHER and TA. Created questions are ACTIVE and source=MANUAL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreateRequest'
      responses:
        '200':
          description: Created question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
  /api/v1/questions/import:
    post:
      tags: [Question]
      summary: Import questions into the question bank
      description: Allowed for ADMIN, TEACHER and TA. Duplicate items in the import payload are skipped by course, type and title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportApiResponse'
  /api/v1/questions/import/markdown:
    post:
      tags: [Question]
      summary: Import Markdown question bank into the question bank
      description: Allowed for ADMIN, TEACHER and TA. Parses exam/question-bank markdown files, writes ACTIVE source=IMPORT questions, sets every imported question knowledge point to the selected course name, and skips duplicates by course, type and title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkdownQuestionImportRequest'
      responses:
        '200':
          description: Markdown import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownQuestionImportApiResponse'
  /api/v1/ai/provider-settings:
    get:
      tags: [AI]
      summary: Get current teacher AI provider setting
      description: Returns base URL, model and masked key metadata for OpenAI or Anthropic; the plaintext API key is never returned. If provider is omitted, the server default provider is used.
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum: [OPENAI, ANTHROPIC]
            default: OPENAI
      responses:
        '200':
          description: AI provider setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderSettingApiResponse'
    put:
      tags: [AI]
      summary: Save current teacher AI provider connection setting
      description: Allowed for ADMIN, TEACHER and TA. Saves baseUrl, model and optional API key. API keys are encrypted at rest and are only used by backend provider adapters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderSettingRequest'
      responses:
        '200':
          description: Saved AI provider setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderSettingApiResponse'
  /api/v1/ai/provider-settings/test:
    post:
      tags: [AI]
      summary: Test current teacher AI provider connection
      description: Uses the submitted baseUrl/model/apiKey, or the teacher saved key/global fallback when apiKey is omitted. The test does not persist settings and never returns plaintext API keys.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderConnectionTestRequest'
      responses:
        '200':
          description: AI provider connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderConnectionTestApiResponse'
  /api/v1/ai/questions/generate:
    post:
      tags: [AI]
      summary: Generate Chinese questions with LangGraph and OpenAI / Anthropic, then persist drafts
      description: Resolves the teacher-specific OpenAI or Anthropic key first, falls back to the matching global environment config, runs validate_input -> resolve_course -> generate_with_ai -> persist_questions, verifies Chinese title/options/analysis/scoring points, and writes generated questions as source=AI, status=PENDING_REVIEW.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiQuestionGenerateRequest'
      responses:
        '200':
          description: Generated and persisted AI question drafts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListResponse'
  /api/v1/papers:
    get:
      tags: [Paper]
      summary: List papers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paper page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperPageResponse'
  /api/v1/papers/{paperId}:
    get:
      tags: [Paper]
      summary: Get paper detail
      description: Available to ADMIN, TEACHER and TA only. Students must use `/api/v1/student/exams/{examId}/paper`, which returns the answer-sheet-specific randomized option order.
      parameters:
        - $ref: '#/components/parameters/PaperId'
      responses:
        '200':
          description: Paper detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperResponse'
    delete:
      tags: [Paper]
      summary: Delete editable paper
      description: Only ADMIN/TEACHER/TA can delete DRAFT or READY papers that have not created exams. Paper-question relations are removed, original question bank items are preserved.
      parameters:
        - $ref: '#/components/parameters/PaperId'
      responses:
        '200':
          description: Delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'
        '409':
          description: Paper is published, archived, or already used by exams
  /api/v1/papers/{paperId}/status:
    patch:
      tags: [Paper]
      summary: Update paper status
      parameters:
        - $ref: '#/components/parameters/PaperId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaperStatusRequest'
      responses:
        '200':
          description: Updated paper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperResponse'
  /api/v1/papers/{paperId}/questions:
    get:
      tags: [Paper]
      summary: List selected questions in a paper with database pagination
      description: Available to ADMIN, TEACHER and TA only. Students must use the assigned-exam paper endpoint.
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paper question page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperQuestionPageResponse'
    post:
      tags: [Paper]
      summary: Add a question to a paper
      parameters:
        - $ref: '#/components/parameters/PaperId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPaperQuestionRequest'
      responses:
        '200':
          description: Updated paper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperResponse'
  /api/v1/papers/{paperId}/answer-key:
    get:
      tags: [Paper]
      summary: Get canonical paper answer key
      description: Available to ADMIN, TEACHER and TA only. Returns canonical question options, answers, analysis and scoring points. This endpoint must never be exposed to students.
      parameters:
        - $ref: '#/components/parameters/PaperId'
      responses:
        '200':
          description: Complete paper answer key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperAnswerKeyResponse'
  /api/v1/papers/{paperId}/compose/random/preview:
    post:
      tags: [Paper]
      summary: Preview random paper composition quality without writing
      parameters:
        - $ref: '#/components/parameters/PaperId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperComposeRequest'
      responses:
        '200':
          description: Compose preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperComposePreviewResponse'
  /api/v1/papers/{paperId}/compose/agent/preview:
    post:
      tags: [Paper]
      summary: Preview LangGraph assisted paper composition plan and quality without writing
      description: Runs the composition planning workflow and backend inventory checks, returns quality distribution and agent plan but does not write paper questions.
      parameters:
        - $ref: '#/components/parameters/PaperId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperComposeRequest'
      responses:
        '200':
          description: Compose preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperComposePreviewResponse'
  /api/v1/papers/{paperId}/compose/random:
    post:
      tags: [Paper]
      summary: Randomly compose a paper from active course question bank
      description: Uses teacher-defined rules to pick ACTIVE questions from the same course. Supports APPEND or REPLACE and validates target score, inventory, question type, difficulty and knowledge point constraints before writing paper questions.
      parameters:
        - $ref: '#/components/parameters/PaperId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperComposeRequest'
      responses:
        '200':
          description: Compose result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperComposeResultResponse'
  /api/v1/papers/{paperId}/compose/agent:
    post:
      tags: [Paper]
      summary: Intelligently compose a paper from active course question bank
      description: Uses the paper compose agent to balance question selection across difficulty and knowledge point buckets. The agent never writes unchecked data directly; backend validation enforces course scope, ACTIVE status, de-duplication, target score and inventory constraints.
      parameters:
        - $ref: '#/components/parameters/PaperId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperComposeRequest'
      responses:
        '200':
          description: Compose result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperComposeResultResponse'
  /api/v1/papers/{paperId}/questions/{questionId}:
    delete:
      tags: [Paper]
      summary: Remove a question from a paper
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Updated paper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperResponse'
  /api/v1/exams:
    get:
      tags: [Exam]
      summary: List exams for teacher workspace with database pagination and class-scope filtering
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Exam list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamListResponse'
    post:
      tags: [Exam]
      summary: Create an exam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamRequest'
      responses:
        '200':
          description: Created exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResponse'
  /api/v1/exams/{examId}:
    get:
      tags: [Exam]
      summary: Get exam detail
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Exam detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResponse'
  /api/v1/student/exams:
    get:
      tags: [Exam]
      summary: List current student's exams
      description: Student identity is resolved from the current Sa-Token session; studentId query is not accepted.
      responses:
        '200':
          description: Student exams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentExamListResponse'
  /api/v1/student/exams/{examId}/paper:
    get:
      tags: [Exam]
      summary: Get current student's randomized exam paper
      description: Student-only payload, available only while the assigned exam is ongoing. SINGLE_CHOICE and MULTIPLE_CHOICE option content is randomized per answer sheet and remains stable after refresh. Correct answers, analysis and scoring points are not returned.
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Student-safe randomized paper payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperResponse'
  /api/v1/answer-sheets/{answerSheetId}:
    get:
      tags: [Answer]
      summary: Get answer sheet detail
      parameters:
        - $ref: '#/components/parameters/AnswerSheetId'
      responses:
        '200':
          description: Answer sheet detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSheetResponse'
  /api/v1/answer-sheets/by-exam/{examId}:
    get:
      tags: [Answer]
      summary: Get current student's answer sheet by exam
      description: Student identity is resolved from the current Sa-Token session; studentId query is not accepted.
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Answer sheet detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSheetResponse'
  /api/v1/answer-sheets/{answerSheetId}/draft:
